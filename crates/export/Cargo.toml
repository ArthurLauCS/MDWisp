[package]
name = "mdwisp-export"
version = "0.5.3"
edition = "2024"

[dependencies]
mdwisp-core = { path = "../core" }
mdwisp-text = { path = "../text" }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
math-core = "0.9"
regex = "1"
base64 = "0.22"
miniz_oxide = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
windows-registry = "0.6"
tempfile = "3"
