[package]
name = "mdwisp-core"
version = "0.6.1"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
miniz_oxide = "0.8"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
trash = "5"
ureq = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile = "3"
