[package]
name = "mdwisp-text"
version = "0.6.1"
edition = "2024"

[dependencies]
mdwisp-core = { path = "../core" }
pulldown-cmark = { version = "0.13", default-features = false }
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-gencat", "unicode-script", "unicode-case"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
