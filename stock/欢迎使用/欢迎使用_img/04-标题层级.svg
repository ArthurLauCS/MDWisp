<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-label="六级标题的排版标本：一二三级为大小递减的粗体衬线，四级正文粗体，五级斜体，六级灰色">
  <rect width="960" height="600" fill="#1A1A18"/>

  <g font-family="'Microsoft YaHei UI', 'Segoe UI', sans-serif">
    <text x="36" y="50" fill="#B49DDC" font-size="12">排版标本</text>
    <text x="36" y="84" fill="#E8E6DF" font-size="26" font-weight="700" font-family="SimSun, Georgia, serif">六级标题，层级靠字号与字重</text>
    <text x="36" y="111" fill="#A09E95" font-size="13">先看大小，再看粗细。本文档本身就是这份标本。</text>

    <rect x="36" y="136" width="888" height="420" fill="#212120" stroke="#3D3D39"/>

    <g stroke="#3D3D39">
      <line x1="48" y1="218" x2="912" y2="218"/>
      <line x1="48" y1="284" x2="912" y2="284"/>
      <line x1="48" y1="350" x2="912" y2="350"/>
      <line x1="48" y1="416" x2="912" y2="416"/>
      <line x1="48" y1="482" x2="912" y2="482"/>
    </g>

    <g font-family="Consolas, monospace" font-size="12" fill="#A09E95">
      <text x="60" y="196">H1</text>
      <text x="60" y="262">H2</text>
      <text x="60" y="328">H3</text>
      <text x="60" y="394">H4</text>
      <text x="60" y="460">H5</text>
      <text x="60" y="526">H6</text>
    </g>

    <g font-family="SimSun, Georgia, serif" font-weight="700" fill="#E8E6DF">
      <text x="134" y="195" font-size="26">文档即文件夹</text>
      <text x="134" y="262" font-size="20">图片跟着文档一起走</text>
      <text x="134" y="328" font-size="16">相对路径由代码保证</text>
    </g>
    <g font-family="SimSun, Georgia, serif">
      <text x="134" y="394" fill="#E8E6DF" font-size="14" font-weight="700">导出之前先把要删的行列出来</text>
      <text x="134" y="460" fill="#C4C2B9" font-size="14" font-style="italic">快捷键 · 命令面板</text>
      <text x="134" y="526" fill="#A09E95" font-size="14">markdown/detect.ts</text>
    </g>

    <g fill="#A09E95" font-size="12" text-anchor="end">
      <text x="900" y="196">26 px，粗体</text>
      <text x="900" y="262">20 px，粗体</text>
      <text x="900" y="328">16 px，粗体</text>
      <text x="900" y="394">正文字号，粗体</text>
      <text x="900" y="460">正文字号，斜体</text>
      <text x="900" y="526">正文字号，灰色</text>
    </g>

    <text x="36" y="584" fill="#A09E95" font-size="12">正文用衬线体，行长上限 680 px；强调色只用于链接、选中和主要操作。</text>
  </g>
</svg>
